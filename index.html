<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Mobile / Responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>QuickBook - Book Movie Tickets Online</title>

    <meta
      name="description"
      content="QuickBook lets you discover movies, find theaters, choose seats, and book movie tickets online quickly and easily."
    />

    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://quickbook.dpdns.org/"
    />

    <!-- Website / Brand -->
    <meta
      name="application-name"
      content="QuickBook"
    />

    <meta
      name="author"
      content="QuickBook"
    />

    <meta
      name="theme-color"
      content="#000000"
    />

    <!-- Open Graph / Social Sharing -->
    <meta
      property="og:title"
      content="QuickBook - Book Movie Tickets Online"
    />

    <meta
      property="og:description"
      content="Discover movies, find theaters, choose seats, and book movie tickets online with QuickBook."
    />

    <meta
      property="og:url"
      content="https://quickbook.dpdns.org/"
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="QuickBook"
    />

    <meta
      property="og:locale"
      content="en_IN"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="QuickBook - Book Movie Tickets Online"
    />

    <meta
      name="twitter:description"
      content="Discover movies, find theaters, choose seats, and book movie tickets online with QuickBook."
    />

    <!-- Favicon -->
    <link
      rel="icon"
      href="/favicon.ico"
    />

    <!-- WebSite Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "QuickBook",
        "alternateName": [
          "QuickBook Movies",
          "QuickBook Ticket Booking"
        ],
        "url": "https://quickbook.dpdns.org/"
      }
    </script>
  </head>

  <body>
    <noscript>
      QuickBook is a movie ticket booking platform that helps you
      discover movies, find theaters, choose seats, and book movie tickets online.
      Please enable JavaScript to use QuickBook.
    </noscript>

    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
